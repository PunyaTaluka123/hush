name: ci
on: [push, pull_request]

jobs:
  firmware-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/tests/host

  backend-e2e: # S1–S13 and the backend invariants against the Firebase emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install argon2-cffi pytest
      - run: npm ci --prefix backend/functions
      - run: ./sim/run_e2e.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cd app-android && ./gradlew testDebugUnitTest lintDebug assembleDebug

  zephyr: # dev-kit build + ztest on native_sim (Linux only)
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:v0.28.4
    steps:
      - uses: actions/checkout@v4
        with: { path: hush }
      - working-directory: hush
        run: |
          west init -l firmware
          west update --narrow -o=--depth=1
          west build -b xiao_ble/nrf52840 firmware -d build/xiao
          west twister -T firmware/tests/ztest -p native_sim --inline-logs
