# DFU over BLE (SPEC §5.5): MCUmgr SMP + MCUboot, refused unless DOCKED.
# For boards with MCUboot slot partitions (the v1 board):
#   west build -b <board> firmware --sysbuild -- -DEXTRA_CONF_FILE=dfu.conf
# The XIAO dev kit keeps its UF2 bootloader and is updated over USB instead.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
